[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketseekr"
version = "0.1.0"
description = "RNA-only ligand-binding pocket identification with regional chemical support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.10", "PyYAML>=6.0", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pocketseekr = "pocketseekr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
