[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketseekr"
version = "0.1.0"
description = "RNA-only binding pocket identification using accessible geometry and regional chemical support"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["RNA", "binding-sites", "pocket-detection", "structural-bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/bioinfo-ccnu/PocketSeekR"
Documentation = "https://github.com/bioinfo-ccnu/PocketSeekR#readme"
Repository = "https://github.com/bioinfo-ccnu/PocketSeekR"
Issues = "https://github.com/bioinfo-ccnu/PocketSeekR/issues"

[project.scripts]
pocketseekr = "pocketseekr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocketseekr = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
